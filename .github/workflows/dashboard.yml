name: Update sales dashboard
on:
  schedule:
    - cron: '0 9 * * *'
  issues:
    types: [opened, edited, closed, reopened, deleted]
  push:
    branches: [main]
    paths: [dashboard.py, test_dashboard.py, .github/workflows/dashboard.yml]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: sales-dashboard
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -q
      - run: python dashboard.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

